[build-system]
requires = ["setuptools>=68", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "bit-jev"
version = "0.11.10"
description = "A Jev/Kev-style decision model on Microsoft's 1.58-bit BitNet b1.58 backbone"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "transformers>=4.48,<5",
    "huggingface_hub",
]

[project.scripts]
bit-jev = "bit_jev.gguf:main"
bit-jev-demo = "bit_jev.demo:main"

[project.urls]
Homepage = "https://github.com/Zeaulo/bit-jev"
Documentation = "https://github.com/Zeaulo/bit-jev#快速开始"
Model = "https://huggingface.co/jinghao1632/bit-jev-2b-distilled"

[project.optional-dependencies]
train = ["torch", "peft==0.14.0", "accelerate>=1.3", "numpy<2", "safetensors>=0.5", "sentencepiece"]
serve = ["fastapi", "uvicorn", "torch", "peft==0.14.0", "accelerate>=1.3", "numpy<2", "safetensors>=0.5"]
data = ["datasets", "torch", "numpy<2"]
benchmark = ["psutil>=5.9"]

[tool.setuptools.packages.find]
include = ["bit_jev*"]
