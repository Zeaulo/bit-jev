<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">bit-jev source architecture</title>
  <desc id="description">A typed decision request becomes one causal row per question. A BitNet I2_S backbone and pointer head produce option probabilities.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eaf3ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#284972" flood-opacity=".11"/>
    </filter>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #14243d; }
      .eyebrow { font-size: 19px; font-weight: 700; letter-spacing: 3px; fill: #2563eb; }
      .title { font-size: 50px; font-weight: 760; letter-spacing: -1.5px; }
      .subtitle { font-size: 23px; fill: #52647c; }
      .card-title { font-size: 27px; font-weight: 720; }
      .card-body { font-size: 19px; fill: #53647a; }
      .note { font-size: 19px; fill: #4a5b72; }
    </style>
  </defs>
  <!-- 当前原生 CPU 路径把每道题单独编码为一条因果行。 -->
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1067" cy="74" r="240" fill="#d6eaff" opacity=".55"/>
  <text x="72" y="76" class="eyebrow">BIT-JEV · SOURCE PREVIEW</text>
  <text x="72" y="141" class="title">Structured decisions on BitNet</text>
  <text x="72" y="181" class="subtitle">Typed questions in · option probabilities out · no answer-token decoding</text>

  <g filter="url(#shadow)">
    <rect x="72" y="245" width="240" height="215" rx="25" fill="#ffffff"/>
    <rect x="352" y="245" width="240" height="215" rx="25" fill="#ffffff"/>
    <rect x="632" y="245" width="240" height="215" rx="25" fill="#ffffff"/>
    <rect x="912" y="245" width="216" height="215" rx="25" fill="#ffffff"/>
  </g>

  <rect x="92" y="268" width="56" height="7" rx="3.5" fill="#2563eb"/>
  <text x="92" y="323" class="card-title">Request</text>
  <text x="92" y="358" class="card-body">state + choice /</text>
  <text x="92" y="385" class="card-body">noul / score</text>

  <rect x="372" y="268" width="56" height="7" rx="3.5" fill="#0891b2"/>
  <text x="372" y="323" class="card-title">Causal row</text>
  <text x="372" y="358" class="card-body">one question</text>
  <text x="372" y="385" class="card-body">per native pass</text>

  <rect x="652" y="268" width="56" height="7" rx="3.5" fill="#6366f1"/>
  <text x="652" y="323" class="card-title">BitNet 2B</text>
  <text x="652" y="358" class="card-body">I2_S CPU</text>
  <text x="652" y="385" class="card-body">backbone</text>

  <rect x="932" y="268" width="56" height="7" rx="3.5" fill="#0d9488"/>
  <text x="932" y="323" class="card-title">Pointer head</text>
  <text x="932" y="358" class="card-body">option scores</text>
  <text x="932" y="385" class="card-body">+ probabilities</text>

  <path d="M317 352h29m-8-8 8 8-8 8M597 352h29m-8-8 8 8-8 8M877 352h29m-8-8 8 8-8 8" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="72" y="508" width="1056" height="68" rx="21" fill="#dcecff"/>
  <text x="98" y="550" class="note">The native CPU path recomputes shared state for each question in a multiquestion request.</text>
</svg>
