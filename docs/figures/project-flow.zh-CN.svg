<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880"><rect width="1600" height="880" fill="#f7f8f8"/><rect x="36" y="36" width="1528" height="808" rx="28" fill="#fff" stroke="#e1e4e6"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><circle cx="87" cy="87" r="18" fill="#3358d4"/><circle cx="87" cy="87" r="7" fill="#fff"/><text x="121" y="94" fill="#252a32" font-size="29" font-weight="800">bit-jev</text><text x="1255" y="92" fill="#79828d" font-size="13" font-weight="700">BITNET × STRUCTURED DECISIONS</text><text x="76" y="166" fill="#252a32" font-size="47" font-weight="760">从三值骨干，到直接决策。</text><text x="78" y="211" fill="#5c6671" font-size="19" font-weight="500">训练产物是 I2_S GGUF 与指针头；推理返回候选项分数，不逐 token 生成答案。</text><line x1="76" y1="245" x2="1524" y2="245" stroke="#e8eaec"/><text x="77" y="294" fill="#b64f41" font-size="21" font-weight="740">01  训练与蒸馏</text><rect x="76" y="317" width="266" height="146" rx="18" fill="#fff" stroke="#dfe3e7"/><rect x="96" y="337" width="32" height="32" rx="9" fill="#d16856"/><text x="105" y="360" fill="#fff" font-size="15" font-weight="700">01</text><text x="96" y="400" fill="#252a32" font-size="23" font-weight="700">BitNet BF16</text><text x="96" y="434" fill="#646d78" font-size="16" font-weight="500">基础骨干</text><path d="M347 390 h13 m-5 -5 5 5 -5 5" fill="none" stroke="#b7bec5" stroke-width="2"/><rect x="368" y="317" width="266" height="146" rx="18" fill="#fff" stroke="#dfe3e7"/><rect x="388" y="337" width="32" height="32" rx="9" fill="#d16856"/><text x="397" y="360" fill="#fff" font-size="15" font-weight="700">02</text><text x="388" y="400" fill="#252a32" font-size="23" font-weight="700">LoRA + 指针头</text><text x="388" y="434" fill="#646d78" font-size="16" font-weight="500">任务微调</text><path d="M639 390 h13 m-5 -5 5 5 -5 5" fill="none" stroke="#b7bec5" stroke-width="2"/><rect x="660" y="317" width="266" height="146" rx="18" fill="#fff" stroke="#dfe3e7"/><rect x="680" y="337" width="32" height="32" rx="9" fill="#d16856"/><text x="689" y="360" fill="#fff" font-size="15" font-weight="700">03</text><text x="680" y="400" fill="#252a32" font-size="23" font-weight="700">Kev 9B logits</text><text x="680" y="434" fill="#646d78" font-size="16" font-weight="500">教师监督</text><path d="M931 390 h13 m-5 -5 5 5 -5 5" fill="none" stroke="#b7bec5" stroke-width="2"/><rect x="952" y="317" width="266" height="146" rx="18" fill="#fff" stroke="#dfe3e7"/><rect x="972" y="337" width="32" height="32" rx="9" fill="#d16856"/><text x="981" y="360" fill="#fff" font-size="15" font-weight="700">04</text><text x="972" y="400" fill="#252a32" font-size="23" font-weight="700">学生蒸馏</text><text x="972" y="434" fill="#646d78" font-size="16" font-weight="500">更新完整骨干</text><path d="M1223 390 h13 m-5 -5 5 5 -5 5" fill="none" stroke="#b7bec5" stroke-width="2"/><rect x="1244" y="317" width="266" height="146" rx="18" fill="#fff" stroke="#dfe3e7"/><rect x="1264" y="337" width="32" height="32" rx="9" fill="#d16856"/><text x="1273" y="360" fill="#fff" font-size="15" font-weight="700">05</text><text x="1264" y="400" fill="#252a32" font-size="23" font-weight="700">I2_S + head.f32</text><text x="1264" y="434" fill="#646d78" font-size="16" font-weight="500">量化导出</text><path d="M1400 468 v29 H202 v34" fill="none" stroke="#c9cfd5" stroke-width="2" stroke-dasharray="7 7"/><text x="77" y="554" fill="#3358d4" font-size="21" font-weight="740">02  安装与推理</text><rect x="76" y="577" width="338" height="146" rx="18" fill="#fff" stroke="#dfe3e7"/><rect x="96" y="597" width="32" height="32" rx="9" fill="#3358d4"/><text x="105" y="620" fill="#fff" font-size="15" font-weight="700">01</text><text x="96" y="660" fill="#252a32" font-size="23" font-weight="700">官方 PyPI 安装</text><text x="96" y="694" fill="#646d78" font-size="16" font-weight="500">获取 Python 包</text><path d="M419 650 h14 m-5 -5 5 5 -5 5" fill="none" stroke="#b7bec5" stroke-width="2"/><rect x="441" y="577" width="338" height="146" rx="18" fill="#fff" stroke="#dfe3e7"/><rect x="461" y="597" width="32" height="32" rx="9" fill="#3358d4"/><text x="470" y="620" fill="#fff" font-size="15" font-weight="700">02</text><text x="461" y="660" fill="#252a32" font-size="23" font-weight="700">本机 Gradio 页面</text><text x="461" y="694" fill="#646d78" font-size="16" font-weight="500">CPU / Vulkan 推理</text><path d="M784 650 h14 m-5 -5 5 5 -5 5" fill="none" stroke="#b7bec5" stroke-width="2"/><rect x="806" y="577" width="338" height="146" rx="18" fill="#fff" stroke="#dfe3e7"/><rect x="826" y="597" width="32" height="32" rx="9" fill="#3358d4"/><text x="835" y="620" fill="#fff" font-size="15" font-weight="700">03</text><text x="826" y="660" fill="#252a32" font-size="23" font-weight="700">首次加载模型</text><text x="826" y="694" fill="#646d78" font-size="16" font-weight="500">约 1.19 GB，之后复用缓存</text><path d="M1149 650 h14 m-5 -5 5 5 -5 5" fill="none" stroke="#b7bec5" stroke-width="2"/><rect x="1171" y="577" width="338" height="146" rx="18" fill="#fff" stroke="#dfe3e7"/><rect x="1191" y="597" width="32" height="32" rx="9" fill="#3358d4"/><text x="1200" y="620" fill="#fff" font-size="15" font-weight="700">04</text><text x="1191" y="660" fill="#252a32" font-size="23" font-weight="700">候选项评分</text><text x="1191" y="694" fill="#646d78" font-size="16" font-weight="500">答案、概率与原生耗时</text><rect x="76" y="753" width="615" height="40" rx="20" fill="#f0f3ff"/><text x="94" y="780" fill="#3358d4" font-size="18" font-weight="650">量化 BitLinear 权重：−1 / 0 / +1</text><rect x="709" y="753" width="815" height="40" rx="20" fill="#fff2ef"/><text x="727" y="780" fill="#b64f41" font-size="18" font-weight="650">指针头直接读出候选项分数</text><text x="78" y="823" fill="#747d87" font-size="15" font-weight="500">多题原生推理逐题运行因果行；速度受输入长度、候选数与硬件影响。</text></g></svg>