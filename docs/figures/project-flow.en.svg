<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880"><rect width="1600" height="880" fill="#f7f8f8"/><rect x="36" y="36" width="1528" height="808" rx="28" fill="#fff" stroke="#e1e4e6"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><circle cx="87" cy="87" r="18" fill="#3358d4"/><circle cx="87" cy="87" r="7" fill="#fff"/><text x="121" y="94" fill="#252a32" font-size="29" font-weight="800">bit-jev</text><text x="1255" y="92" fill="#79828d" font-size="13" font-weight="700">BITNET × STRUCTURED DECISIONS</text><text x="76" y="166" fill="#252a32" font-size="47" font-weight="760">From ternary weights to direct decisions.</text><text x="78" y="211" fill="#5c6671" font-size="19" font-weight="500">Training exports I2_S GGUF and a pointer head; inference scores options without answer-token generation.</text><line x1="76" y1="245" x2="1524" y2="245" stroke="#e8eaec"/><text x="77" y="294" fill="#b64f41" font-size="21" font-weight="740">01  TRAIN &amp; DISTILL</text><rect x="76" y="317" width="266" height="146" rx="18" fill="#fff" stroke="#dfe3e7"/><rect x="96" y="337" width="32" height="32" rx="9" fill="#d16856"/><text x="105" y="360" fill="#fff" font-size="15" font-weight="700">01</text><text x="96" y="400" fill="#252a32" font-size="23" font-weight="700">BitNet BF16</text><text x="96" y="434" fill="#646d78" font-size="16" font-weight="500">base backbone</text><path d="M347 390 h13 m-5 -5 5 5 -5 5" fill="none" stroke="#b7bec5" stroke-width="2"/><rect x="368" y="317" width="266" height="146" rx="18" fill="#fff" stroke="#dfe3e7"/><rect x="388" y="337" width="32" height="32" rx="9" fill="#d16856"/><text x="397" y="360" fill="#fff" font-size="15" font-weight="700">02</text><text x="388" y="400" fill="#252a32" font-size="23" font-weight="700">LoRA + pointer</text><text x="388" y="434" fill="#646d78" font-size="16" font-weight="500">task fine-tuning</text><path d="M639 390 h13 m-5 -5 5 5 -5 5" fill="none" stroke="#b7bec5" stroke-width="2"/><rect x="660" y="317" width="266" height="146" rx="18" fill="#fff" stroke="#dfe3e7"/><rect x="680" y="337" width="32" height="32" rx="9" fill="#d16856"/><text x="689" y="360" fill="#fff" font-size="15" font-weight="700">03</text><text x="680" y="400" fill="#252a32" font-size="23" font-weight="700">Kev 9B logits</text><text x="680" y="434" fill="#646d78" font-size="16" font-weight="500">teacher targets</text><path d="M931 390 h13 m-5 -5 5 5 -5 5" fill="none" stroke="#b7bec5" stroke-width="2"/><rect x="952" y="317" width="266" height="146" rx="18" fill="#fff" stroke="#dfe3e7"/><rect x="972" y="337" width="32" height="32" rx="9" fill="#d16856"/><text x="981" y="360" fill="#fff" font-size="15" font-weight="700">04</text><text x="972" y="400" fill="#252a32" font-size="23" font-weight="700">Student distill</text><text x="972" y="434" fill="#646d78" font-size="16" font-weight="500">update full backbone</text><path d="M1223 390 h13 m-5 -5 5 5 -5 5" fill="none" stroke="#b7bec5" stroke-width="2"/><rect x="1244" y="317" width="266" height="146" rx="18" fill="#fff" stroke="#dfe3e7"/><rect x="1264" y="337" width="32" height="32" rx="9" fill="#d16856"/><text x="1273" y="360" fill="#fff" font-size="15" font-weight="700">05</text><text x="1264" y="400" fill="#252a32" font-size="23" font-weight="700">I2_S + head.f32</text><text x="1264" y="434" fill="#646d78" font-size="16" font-weight="500">quantized export</text><path d="M1400 468 v29 H202 v34" fill="none" stroke="#c9cfd5" stroke-width="2" stroke-dasharray="7 7"/><text x="77" y="554" fill="#3358d4" font-size="21" font-weight="740">02  INSTALL &amp; INFER</text><rect x="76" y="577" width="338" height="146" rx="18" fill="#fff" stroke="#dfe3e7"/><rect x="96" y="597" width="32" height="32" rx="9" fill="#3358d4"/><text x="105" y="620" fill="#fff" font-size="15" font-weight="700">01</text><text x="96" y="660" fill="#252a32" font-size="23" font-weight="700">pip install bit-jev</text><text x="96" y="694" fill="#646d78" font-size="16" font-weight="500">install Python package</text><path d="M419 650 h14 m-5 -5 5 5 -5 5" fill="none" stroke="#b7bec5" stroke-width="2"/><rect x="441" y="577" width="338" height="146" rx="18" fill="#fff" stroke="#dfe3e7"/><rect x="461" y="597" width="32" height="32" rx="9" fill="#3358d4"/><text x="470" y="620" fill="#fff" font-size="15" font-weight="700">02</text><text x="461" y="660" fill="#252a32" font-size="23" font-weight="700">CPU / Vulkan</text><text x="461" y="694" fill="#646d78" font-size="16" font-weight="500">prebuilt on Windows x64 AVX2</text><path d="M784 650 h14 m-5 -5 5 5 -5 5" fill="none" stroke="#b7bec5" stroke-width="2"/><rect x="806" y="577" width="338" height="146" rx="18" fill="#fff" stroke="#dfe3e7"/><rect x="826" y="597" width="32" height="32" rx="9" fill="#3358d4"/><text x="835" y="620" fill="#fff" font-size="15" font-weight="700">03</text><text x="826" y="660" fill="#252a32" font-size="23" font-weight="700">First model load</text><text x="826" y="694" fill="#646d78" font-size="16" font-weight="500">~1.19 GB; then cached</text><path d="M1149 650 h14 m-5 -5 5 5 -5 5" fill="none" stroke="#b7bec5" stroke-width="2"/><rect x="1171" y="577" width="338" height="146" rx="18" fill="#fff" stroke="#dfe3e7"/><rect x="1191" y="597" width="32" height="32" rx="9" fill="#3358d4"/><text x="1200" y="620" fill="#fff" font-size="15" font-weight="700">04</text><text x="1191" y="660" fill="#252a32" font-size="23" font-weight="700">Score options</text><text x="1191" y="694" fill="#646d78" font-size="16" font-weight="500">answers, probabilities, latency</text><rect x="76" y="753" width="615" height="40" rx="20" fill="#f0f3ff"/><text x="94" y="780" fill="#3358d4" font-size="18" font-weight="650">Quantized BitLinear weights: −1 / 0 / +1</text><rect x="709" y="753" width="815" height="40" rx="20" fill="#fff2ef"/><text x="727" y="780" fill="#b64f41" font-size="18" font-weight="650">Pointer head reads out option scores</text><text x="78" y="823" fill="#747d87" font-size="15" font-weight="500">Native multi-question inference runs one causal row per question; speed depends on request and hardware.</text></g></svg>