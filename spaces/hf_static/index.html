<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="bit-jev 中英双语 CPU 在线测试入口">
  <title>bit-jev · 在线测试</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <main class="shell">
    <!-- 免费静态 Space 只展示入口；推理始终由公开的 ModelScope CPU 容器执行。 -->
    <header class="topbar">
      <img src="logo.png" alt="bit-jev 0/1 火箭标志" class="logo">
      <div class="language" aria-label="Language">
        <button type="button" data-lang="zh" aria-pressed="true">中文</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
    </header>
    <section class="intro">
      <p class="eyebrow" data-i18n="eyebrow">真实模型 · 免费 CPU 演示</p>
      <h1 data-i18n="title">普通电脑，CPU 就能跑 JEV，而且很快！</h1>
      <p data-i18n="description">选择选择题、是非题或等级题，填写问题后运行真实模型。</p>
      <div class="actions">
        <a class="primary" href="https://jinghao9616-bit-jev-demo.ms.show/" target="_blank" rel="noopener" data-i18n="open">打开在线测试 ↗</a>
        <a class="secondary" href="https://github.com/Zeaulo/bit-jev" target="_blank" rel="noopener">GitHub ↗</a>
      </div>
      <p class="note" data-i18n="note">说明 / Note: 免费空间使用 2 vCPU 进行推理。</p>
    </section>
    <section class="frame-wrap" aria-label="bit-jev live demo">
      <iframe title="bit-jev ModelScope live CPU demo" src="https://jinghao9616-bit-jev-demo.ms.show/" loading="lazy" referrerpolicy="no-referrer"></iframe>
    </section>
  </main>
</body>
</html>
